<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>LakeNav WI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<style>
html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#dfeff5;color:#102532}#app{height:100%;display:flex;flex-direction:column}.top{background:#0a3555;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.top small{display:block;opacity:.85}.metrics{text-align:right;font-size:12px}.metrics strong{font-size:16px}#map{flex:1;min-height:0}.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#fff;padding:6px;border-top:1px solid #c4d4dc}.bar button{border:0;border-radius:10px;background:#e8f0f4;min-height:50px;font-weight:700}.panel{position:absolute;left:10px;right:10px;bottom:70px;z-index:1000;background:#fff;border-radius:14px;padding:12px;box-shadow:0 4px 18px rgba(0,0,0,.25);display:none;max-height:55%;overflow:auto}.panel.open{display:block}.row{padding:8px 0;border-bottom:1px solid #e8eef1}.btn{border:0;border-radius:9px;background:#0a3555;color:white;padding:9px 12px;font-weight:700}.btn.alt{background:#e6eef2;color:#163243}.warn{font-size:12px;background:#fff5d8;padding:8px;border-radius:8px;margin-top:8px}.nav{background:#fff;padding:7px 10px;border-bottom:1px solid #cbd8de;display:none}.nav.on{display:flex;justify-content:space-between;align-items:center;gap:8px}.chip{position:absolute;z-index:600;top:70px;right:10px;background:#fff;padding:6px 9px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="app">
  <div class="top"><div><strong>LakeNav WI</strong><small id="gps">Waiting for GPS...</small></div><div class="metrics"><strong id="spd">--</strong> mph<br><span id="acc">-- ft</span></div></div>
  <div id="nav" class="nav"><div><small>NAVIGATING TO</small><strong id="navName">Waypoint</strong></div><div><strong id="navDist">--</strong><br><small id="navBear">--</small></div><button class="btn" id="stopNav">Stop</button></div>
  <div id="map"></div><div class="chip" id="chip">OSM map</div>
  <div class="bar"><button id="center">GPS</button><button id="mark">Mark</button><button id="wps">Waypoints</button><button id="track">Track</button><button id="more">More</button></div>
</div>
<div id="wpPanel" class="panel"><h3>Waypoints</h3><div id="wpList"></div><button class="btn alt" onclick="closePanels()">Close</button></div>
<div id="morePanel" class="panel"><h3>Lake tools</h3><div class="row"><label><input type="checkbox" id="noaa"> NOAA chart overlay</label><div class="warn">NOAA chart coverage is mainly Great Lakes and federally charted waters. Charted depth is not live sonar depth.</div></div><div class="row"><button class="btn" id="weather">Weather / alerts</button><div id="weatherOut"></div></div><div class="row"><button class="btn alt" id="export">Export GPX</button> <button class="btn alt" id="import">Import GPX</button></div><div class="row"><button class="btn alt" id="dnr">WI DNR lake maps</button></div><button class="btn alt" onclick="closePanels()">Close</button></div>
<script>
(function(){
let map,meMarker,trackLine,noaaLayer,current=null,recording=false,navWp=null;
let waypoints=JSON.parse(localStorage.getItem('wps')||'[]');let trackPts=JSON.parse(localStorage.getItem('track')||'[]');
const $=id=>document.getElementById(id);const rad=x=>x*Math.PI/180;
function dist(a,b,c,d){const R=6371000,p1=rad(a),p2=rad(c),dp=rad(c-a),dl=rad(d-b),x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function bearing(a,b,c,d){const y=Math.sin(rad(d-b))*Math.cos(rad(c)),x=Math.cos(rad(a))*Math.sin(rad(c))-Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(rad(d-b));return (Math.atan2(y,x)*180/Math.PI+360)%360}
function fmt(m){return m<1609.344?(m*3.28084).toFixed(0)+' ft':(m/1609.344).toFixed(2)+' mi'}
function closePanels(){$('wpPanel').classList.remove('open');$('morePanel').classList.remove('open')}window.closePanels=closePanels;
function save(){localStorage.setItem('wps',JSON.stringify(waypoints));localStorage.setItem('track',JSON.stringify(trackPts))}
function init(){map=L.map('map').setView([44.5,-89.5],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'OpenStreetMap'}).addTo(map);trackLine=L.polyline(trackPts.map(p=>[p.lat,p.lon]),{weight:4}).addTo(map);renderWp();}
function renderWp(){document.querySelectorAll('.wpmark').forEach(()=>{}); if(window._wpLayers){window._wpLayers.forEach(m=>map.removeLayer(m))}window._wpLayers=[];waypoints.forEach((w,i)=>{let m=L.marker([w.lat,w.lon]).addTo(map).bindPopup(w.name);window._wpLayers.push(m)});$('wpList').innerHTML=waypoints.length?waypoints.map((w,i)=>'<div class="row"><strong>'+esc(w.name)+'</strong><br><small>'+w.lat.toFixed(5)+', '+w.lon.toFixed(5)+'</small><br><button class="btn" data-nav="'+i+'">Navigate</button> <button class="btn alt" data-del="'+i+'">Delete</button></div>').join(''):'<p>No waypoints saved.</p>';document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>startNav(+b.dataset.nav));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{waypoints.splice(+b.dataset.del,1);save();renderWp()})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mark(){if(!current){alert('Waiting for GPS fix.');return}let n=prompt('Waypoint name','Waypoint '+(waypoints.length+1));if(!n)return;waypoints.push({name:n,lat:current.lat,lon:current.lon});save();renderWp()}
function startNav(i){navWp=waypoints[i];closePanels();$('nav').classList.add('on');$('navName').textContent=navWp.name;updateNav()}
function updateNav(){if(!current||!navWp)return;let d=dist(current.lat,current.lon,navWp.lat,navWp.lon),b=bearing(current.lat,current.lon,navWp.lat,navWp.lon);$('navDist').textContent=fmt(d);$('navBear').textContent=Math.round(b)+' deg'}
window.onNativeLocation=function(lat,lon,accuracy,speed,bear,time){current={lat,lon};$('gps').textContent=lat.toFixed(5)+', '+lon.toFixed(5);$('spd').textContent=speed>=0?(speed*2.23694).toFixed(1):'--';$('acc').textContent=accuracy>=0?Math.round(accuracy*3.28084)+' ft':'--';if(!meMarker){meMarker=L.circleMarker([lat,lon],{radius:8,weight:3}).addTo(map);map.setView([lat,lon],15)}else meMarker.setLatLng([lat,lon]);if(recording){let last=trackPts[trackPts.length-1];if(!last||dist(last.lat,last.lon,lat,lon)>3){trackPts.push({lat,lon,time});if(trackPts.length>12000)trackPts.shift();save();trackLine.setLatLngs(trackPts.map(p=>[p.lat,p.lon]))}}updateNav()}
$('center').onclick=()=>{if(current)map.setView([current.lat,current.lon],Math.max(15,map.getZoom()));else if(window.Android)Android.openLocationSettings()};$('mark').onclick=mark;$('wps').onclick=()=>{$('wpPanel').classList.add('open')};$('more').onclick=()=>{$('morePanel').classList.add('open')};$('track').onclick=()=>{recording=!recording;$('track').textContent=recording?'Stop Track':'Track';if(window.Android)Android.keepScreenOn(recording)};$('stopNav').onclick=()=>{navWp=null;$('nav').classList.remove('on')};
$('noaa').onchange=e=>{if(e.target.checked){noaaLayer=L.tileLayer.wms('https://gis.charttools.noaa.gov/arcgis/services/MCS/ENCOnline/MapServer/WMSServer',{layers:'0',format:'image/png',transparent:true,opacity:.7}).addTo(map);$('chip').textContent='NOAA overlay'}else{if(noaaLayer)map.removeLayer(noaaLayer);$('chip').textContent='OSM map'}};
$('weather').onclick=async()=>{if(!current){$('weatherOut').textContent='Waiting for GPS.';return}try{$('weatherOut').textContent='Loading...';let p=await fetch('https://api.weather.gov/points/'+current.lat.toFixed(4)+','+current.lon.toFixed(4)).then(r=>r.json());let f=await fetch(p.properties.forecastHourly).then(r=>r.json());let x=f.properties.periods[0];let a=await fetch('https://api.weather.gov/alerts/active?point='+current.lat.toFixed(4)+','+current.lon.toFixed(4)).then(r=>r.json());$('weatherOut').innerHTML='<p><strong>'+esc(x.temperature+' '+x.temperatureUnit+', '+x.shortForecast)+'</strong><br>Wind: '+esc(x.windSpeed+' '+x.windDirection)+'</p><p>Active alerts: '+(a.features||[]).length+'</p>'}catch(e){$('weatherOut').textContent='Weather unavailable.'}};
$('export').onclick=()=>{let w=waypoints.map(x=>'<wpt lat="'+x.lat+'" lon="'+x.lon+'"><name>'+escXml(x.name)+'</name></wpt>').join('\n'),t=trackPts.length?'<trk><trkseg>'+trackPts.map(p=>'<trkpt lat="'+p.lat+'" lon="'+p.lon+'"></trkpt>').join('')+'</trkseg></trk>':'';let g='<?xml version="1.0"?><gpx version="1.1" xmlns="http://www.topografix.com/GPX/1/1">'+w+t+'</gpx>';if(window.Android)Android.exportGpx('LakeNav-WI.gpx',g)};$('import').onclick=()=>{if(window.Android)Android.importGpx()};window.importGpxText=function(text){try{let d=new DOMParser().parseFromString(text,'application/xml');Array.from(d.getElementsByTagName('wpt')).forEach((n,i)=>{let nm=n.getElementsByTagName('name')[0];waypoints.push({name:nm?nm.textContent:'Imported '+(i+1),lat:+n.getAttribute('lat'),lon:+n.getAttribute('lon')})});save();renderWp();alert('GPX imported.')}catch(e){alert('Could not import GPX.')}};function escXml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};$('dnr').onclick=()=>{if(window.Android)Android.openExternal('https://dnr.wisconsin.gov/topic/Fishing/questions/lakemaps')};init();
})();
</script>
</body>
</html>
