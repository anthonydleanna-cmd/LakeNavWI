name: Satellite Bathymetry Research

on:
  push:
    branches: [ "research/satellite-bathymetry-test" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out LakeNav research branch
        uses: actions/checkout@v4

      - name: Check out NTL digital bathymetry reference
        uses: actions/checkout@v4
        with:
          repository: hdugan/NTLlakeloads
          path: ntl-reference

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: pip install geopandas requests pyogrio shapely pyproj rasterio scikit-learn pandas numpy openpyxl

      - name: Run Sentinel-2 validation
        env:
          NTL_REFERENCE_ROOT: ${{ github.workspace }}/ntl-reference
          GDAL_HTTP_MULTIPLEX: YES
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.TIF
        run: python research/run_validate_fixed.py

      - name: Run optical shallows study
        run: python research/optical_shallows_eval.py

      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: satellite-bathy-validation
          path: |
            research_validation
            research_optical_shallows
