name: Wisconsin Depth Coverage Census

on:
  workflow_dispatch:
  push:
    branches: [ "research/depth-data-sources" ]
    paths:
      - "research/depth-data-sources/**"
      - ".github/workflows/depth-census-research.yml"

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: pip install requests beautifulsoup4 shapely geopandas pyogrio pyarrow

      - name: Run Wisconsin depth census
        run: python research/depth-data-sources/census_local_dnr.py

      - name: Upload census output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wisconsin-depth-census-core
          path: research/depth-data-sources/output/
          if-no-files-found: warn
