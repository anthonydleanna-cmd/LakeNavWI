name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Materialize LakeNav WI v0.4
        run: bash .bootstrap/apply-v04.sh

      - name: Apply LakeNav WI v0.5
        run: bash .bootstrap/apply-v05.sh

      - name: Apply LakeNav WI v0.6
        run: bash .bootstrap/apply-v06.sh

      - name: Apply LakeNav WI v0.7
        run: bash .bootstrap/apply-v07.sh

      - name: Apply LakeNav WI v0.8
        run: bash .bootstrap/apply-v08.sh

      - name: Apply LakeNav WI v0.9
        run: bash .bootstrap/apply-v09.sh

      - name: Apply LakeNav WI v0.10
        run: bash .bootstrap/apply-v010.sh

      - name: Apply LakeNav WI v0.11
        run: bash .bootstrap/apply-v011.sh

      - name: Apply LakeNav WI v0.12
        run: bash .bootstrap/apply-v012.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LakeNavWI-v0.12-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
