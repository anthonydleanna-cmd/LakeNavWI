name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Materialize LakeNav WI through latest patch
        run: |
          find .bootstrap -maxdepth 1 -type f -name 'apply-v*.sh' -print | sort -V | while read -r script; do
            echo "Applying $script"
            bash "$script"
          done

      - name: Bundle MapLibre 3D engine into APK
        run: |
          curl -fL --retry 3 https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js -o app/src/main/assets/maplibre-gl.js
          curl -fL --retry 3 https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css -o app/src/main/assets/maplibre-gl.css
          test -s app/src/main/assets/maplibre-gl.js
          test -s app/src/main/assets/maplibre-gl.css

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LakeNavWI-v0.66-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
