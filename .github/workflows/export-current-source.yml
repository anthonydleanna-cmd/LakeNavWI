name: Export current LakeNav source

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/export-current-source.yml"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Materialize LakeNav WI through latest patch
        run: |
          find .bootstrap -maxdepth 1 -type f -name 'apply-v*.sh' -print | sort -V | while read -r script; do
            echo "Applying $script"
            bash "$script"
          done

      - name: Collect source snapshot
        run: |
          mkdir -p source-snapshot
          cp -R app source-snapshot/app
          cp README.md source-snapshot/README.md
          cp settings.gradle source-snapshot/settings.gradle
          cp build.gradle source-snapshot/build.gradle

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: LakeNavWI-current-source-snapshot
          path: source-snapshot
